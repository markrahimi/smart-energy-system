
services:
  # Keycloak - Authentication
  keycloak:
    image: keycloak/keycloak:26.3.5
    container_name: energy-keycloak
    ports:
      - "9080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    networks:
      - energy-network

  # Backend - Spring Boot
  backend:
    build: ./backend
    container_name: energy-backend
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
    networks:
      - energy-network

  # Frontend - Vue
  frontend:
    build: ./frontend
    container_name: energy-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - energy-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  energy-network:
    driver: bridge
